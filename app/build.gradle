/*
 * Automated Financial Portfolio Tracker
 * Gradle Build Configuration
 */

plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // Networking: For making HTTP requests to financial APIs
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Data Parsing: For converting JSON API payloads into Java Objects
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // Reporting: To generate professional PDF summary reports
    implementation 'com.itextpdf:itext7-core:7.2.5'

    // Persistence: Light database to store user transactions
    implementation 'com.h2database:h2:2.2.224'

    // Testing Frameworks
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
}

testing {
    suites {
        test {
            useJUnitJupiter('5.10.2')
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(Test).configureEach {
    jvmArgs(
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '-Dnet.bytebuddy.experimental=true'
    )
}

application {
    mainClass = 'com.tracker.Main'
}

tasks.named('run') {
    standardInput = System.in
}
